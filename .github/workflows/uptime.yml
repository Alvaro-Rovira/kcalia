# Vigila que kcalia.space responda, desde fuera de la VPS. Si falla, abre una incidencia (GitHub avisa por correo al
# dueño del repositorio); cuando vuelve a responder, la cierra. GitHub puede retrasar unos minutos las ejecuciones
# programadas y las desactiva si el repositorio pasa 60 días sin actividad.
name: Disponibilidad

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar /api/health (tres intentos)
        id: health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://kcalia.space/api/health || true)
            echo "Intento $attempt: $code"
            if [ "$code" = "200" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 30
          done
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Abrir o cerrar la incidencia
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ steps.health.outputs.ok }}
          CODE: ${{ steps.health.outputs.code }}
        run: |
          title="kcalia.space no responde"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          now=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [ "$OK" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Vuelve a responder ($now)."
            fi
          elif [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "Desde $now, https://kcalia.space/api/health no responde (último código: ${CODE:-sin respuesta}, tres intentos). Mira el servidor: \`ssh root@161.97.67.178 'cd /opt/kcalia && docker compose ps && docker compose logs --tail=50 app'\`. La incidencia se cierra sola cuando vuelva a responder."
          else
            echo "Ya hay una incidencia abierta (#$open)."
          fi
