name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependencias
        run: uv sync --project backend
      - name: Lint
        run: uv run --project backend ruff check backend scripts
      - name: Tests
        run: uv run --project backend pytest backend -q

  frontend:
    name: Frontend (tipos + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Tipos
        run: npx tsc -b --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  voz:
    name: Voz (decodificador de audio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Con las mismas versiones fijadas que la imagen: un cambio incompatible entre librerías falla aquí.
      - name: Tests
        run: uv run --python 3.12 --with-requirements requirements.txt --with pytest pytest -q test_audio.py

  e2e:
    name: End-to-end (Chromium, móvil 390 px)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Navegador
        run: uv run --project backend --group e2e python -m playwright install --with-deps chromium
      - name: Flujo completo
        run: uv run --project backend --group e2e pytest e2e -q
